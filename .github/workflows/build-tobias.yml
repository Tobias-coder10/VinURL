name: Build (26.3)

# Bouwt de mod bij elke wijziging op de 26.3-branch.
# - Het .jar-bestand staat daarna onder "Artifacts" in het tabblad Actions.
# - Het bouwverslag wordt in de branch "build-log" gezet, zodat Claude het kan lezen.

on:
  push:
    branches:
      - "26.3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew build --stacktrace --console=plain > build.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          tail -n 60 build.log

      - name: Dump class signatures (only when .github/dump-classes.txt exists)
        if: hashFiles('.github/dump-classes.txt') != ''
        run: |
          JAR=""
          for j in $(find ~/.gradle/caches .gradle -path '*minecraft*' -name '*.jar' 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/gui/screens/Screen.class'; then JAR="$j"; break; fi
          done
          echo "Minecraft jar: $JAR" > dump.txt
          if [ -n "$JAR" ]; then
            while read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                list:*) echo "===== LIST ${line#list:}" >> dump.txt
                        unzip -l "$JAR" | awk '{print $4}' | grep -E "${line#list:}" >> dump.txt ;;
                *)      echo "===== $line" >> dump.txt
                        javap -public -cp "$JAR" "$line" >> dump.txt 2>&1 ;;
              esac
            done < .github/dump-classes.txt
          fi

      - name: Upload jar
        if: steps.build.outputs.exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: vinurl-26.3
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish build log to branch build-log
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || echo "no build log" > /tmp/out/build.log
          cp dump.txt /tmp/out/ 2>/dev/null || true
          printf 'commit: %s\nexit: %s\n' "${{ github.sha }}" "${{ steps.build.outputs.exit }}" > /tmp/out/status.txt
          cd /tmp/out
          git init -q -b build-log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "build log for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-log

      - name: Fail if build failed
        if: steps.build.outputs.exit != '0'
        run: exit 1
